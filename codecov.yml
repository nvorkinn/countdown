# Countdown CI only runs when its own files change, so carry its last upload
# forward instead of reporting it as missing.
flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: countdown
      paths:
        - countdown/
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true
