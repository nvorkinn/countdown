[project]
name = "countdown"
authors = [{ name = "Nikolai Vorkinn" }]

version = "0.0.0-dev"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
# The workspace's own packages, so `uv sync` installs them all (editable) for the tests.
dependencies = [
    "countdown-api",
    "countdown-shared",
    "countdown-renderer",
    "countdown-providers",
]

[tool.uv]
package = false

[tool.uv.sources]
countdown-api = { workspace = true }
countdown-shared = { workspace = true }
countdown-renderer = { workspace = true }
countdown-providers = { workspace = true }

[dependency-groups]
dev = [
    "deptry",
    "fakeredis[lua]",
    # tests/test_utils.py compares images with it; no package imports it.
    "numpy",
    "pyinstrument",
    "pyproject-runner",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    # Random test order (the seed is in the header; repeat a run with `pytest --randomly-seed=N`),
    # which surfaces hidden order dependence.
    "pytest-randomly",
    # Some tests start real redis-servers: a hang fails after the timeout instead of stalling the job.
    "pytest-timeout",
    "pytest-xdist",
    "pyyaml",
    "responses",
    "ruff",
    "ty==0.0.91",
]

[tool.uv.workspace]
members = [
    "api",
    "shared",
    "renderer",
    "providers"
]

[tool.pytest.ini_options]
# A test taking this long is hung (the slowest here are those starting a real redis-server).
timeout = 120

# Unused, missing and transitive dependencies. A workspace takes one run per package, each against the dependencies in
# its own pyproject.toml: `deptry src` in shared/, renderer/ and providers/ (the deptry job in tests.yml runs them; api/
# is the countdown-api submodule, which its own repository checks). The packages' sources are theirs to check and
# deptry skips tests/ by default (they import the workspace's packages and what those use), so this run reads only
# this file's own dependencies.
[tool.deptry]
extend_exclude = ["api", "shared", "renderer", "providers"]

[tool.deptry.per_rule_ignores]
# Installed so `uv sync` has the whole workspace for the tests, which import them; nothing here does.
DEP002 = ["countdown-api", "countdown-shared", "countdown-renderer", "countdown-providers"]

[tool.coverage.run]
branch = true
source = [
    "api/src",
    "shared/src",
    "renderer/src",
    "providers/src"
]
[tool.coverage.report]
skip_empty = true

[tool.ruff]
target-version = "py314"
line-length = 120
# So isort knows the workspace packages are first-party.
src = [
    "api/src",
    "shared/src",
    "renderer/src",
    "providers/src"
]
# Even when a file is named on the command line, as pre-commit does with every changed file.
force-exclude = true

[tool.ruff.lint]
# Every rule, bar the few below that can't be satisfied together with another rule or with `ruff format`.
select = ["ALL"]
ignore = [
    "D203",   # one blank line before a class docstring: contradicts D211 (no blank line), which we keep
    "D213",   # summary on the docstring's second line: contradicts D212 (on the first), which we keep
    "COM812", # trailing commas: ruff format adds and removes them itself, and the two fight
    "ISC001", # implicit string concatenation on one line: can clash with ruff format
    "CPY001", # a copyright notice at the top of every file: a policy this repo doesn't have
]

# Pydantic models need their annotations' imports at run time, not only for type checking.
[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

# countdown-shared must stay free of the apps: they depend on it, never the other way round.
# The ban only applies inside shared/ (see per-file-ignores).
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"countdown_renderer".msg = "countdown-shared can't depend on countdown-renderer; pass what it needs in from there"
"countdown_providers".msg = "countdown-shared can't depend on countdown-providers; pass what it needs in from there"

[tool.ruff.lint.per-file-ignores]
"!shared/**" = ["TID251"]
"tests/**" = [
    "S101",    # pytest is built on assert
    "PLR2004", # a test compares against the literal values it expects
    "D1",      # a test's name says what it checks; fixtures and fakes are local to the tests
    "ANN",     # pytest injects fixtures by name, and their types add nothing to a test
    "ARG",     # fixtures requested only for their side effect, and fakes matching a real signature
    "SLF001",  # tests look at private state to check it
    "INP001",  # tests/ is a pytest rootdir, not a package
    "S105",    # fake tokens and passwords
    "S106",
    "S107",
]
"dev/**" = [
    "T201",   # command-line scripts: printing is their output
    "INP001", # standalone scripts, run by path, not a package
]

[tool.pyproject-runner.tasks]

[tool.ty.src]
# api/ is the countdown-api submodule: type checked by its own repository (its package still resolves, from .venv).
exclude = ["api"]

[[tool.ty.overrides]]
# The tests read Optional results without narrowing them first (a None fails the test anyway), build models from
# loose dicts and literals that pydantic coerces, and monkeypatch methods. Those are what these rules flag there;
# the packages are checked with every rule.
include = ["tests/**"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
not-subscriptable = "ignore"
not-iterable = "ignore"
unsupported-operator = "ignore"
invalid-assignment = "ignore"
