version: 2
updates:
  # countdown/pyproject.toml and uv.lock: the workspace's one lockfile.
  - package-ecosystem: "uv"
    directory: "/countdown"
    schedule:
      interval: "daily"
  # .pre-commit-config.yaml's hook revs. Ruff is pinned in both places: keep them in step.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # countdown/api: a new commit of the store contract shows up as a PR.
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
