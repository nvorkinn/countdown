name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '40 13 * * 4'
  # By hand, e.g. to re-scan main when a merge didn't trigger a push run.
  workflow_dispatch:

jobs:
  # Works out which languages need analysing for this run.
  changes:
    name: Detect changed sub-projects
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      languages: ${{ steps.pick.outputs.languages }}
    steps:
      # On pull requests the filter reads the changed files from the API,
      # so no checkout is needed.
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          # Filter names must match CodeQL language names, because the list of
          # matched filters is used directly as the language matrix.
          filters: |
            actions:
              - '.github/workflows/**'
              - '.github/actions/**'
            python:
              - 'countdown/**'
              - '.github/workflows/codeql.yml'

      # Pull requests: only what changed. Push to main, the weekly schedule
      # and manual runs: everything, so main always has a complete baseline.
      - name: Pick languages
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo "languages=$CHANGED" >> "$GITHUB_OUTPUT"
          else
            echo 'languages=["actions","python"]' >> "$GITHUB_OUTPUT"
          fi

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    # An empty matrix is an error, so skip the job when nothing relevant changed.
    if: needs.changes.outputs.languages != '[]'
    runs-on: ubuntu-latest
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.changes.outputs.languages) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # All three languages here are analysed without a build.
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
