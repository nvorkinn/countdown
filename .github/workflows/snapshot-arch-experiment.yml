# THROWAWAY: redraws every golden in the pinned image and commits it to the branch (the sandbox that wrote this can't
# run Docker or download the font). Remove before merging.
name: snapshot goldens regen

on:
  push:
    branches: [claude/docker-snapshots]
    paths:
      - ".github/workflows/snapshot-arch-experiment.yml"

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: countdown
    steps:
      - uses: actions/checkout@v7
      - run: git submodule update --init
      - name: Redraw the goldens in the pinned image
        run: ./dev/snapshots.sh update -q
      - name: Commit them
        working-directory: .
        run: |
          git status --short countdown/tests/images | tail -5
          echo "::notice title=regen::$(git status --short countdown/tests/images | wc -l) goldens changed"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add countdown/tests/images
          git commit -m "Redraw every golden in the pinned snapshot image" || exit 0
          git push
