name: countdown CI

on:
  push:
    paths:
      - "countdown/**"
      - ".github/workflows/countdown-ci.yml"
  pull_request:
    paths:
      - "countdown/**"
      - ".github/workflows/countdown-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: countdown

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Pull latest API Contract submodule
        run: git submodule update --init --remote

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Run Ruff
        run: uv run --frozen --only-group dev ruff check --output-format=github .

      - name: Check Ruff formatting
        run: uv run --frozen --only-group dev ruff format --check --diff .

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Pull latest API Contract submodule
        run: git submodule update --init --remote

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install system dependencies
        # libfribidi0 turns on Pillow's Raqm text layout, which the golden images are drawn with.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfribidi0

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        # One worker per CPU; pytest-cov combines their coverage.
        run: uv run pytest -n auto --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: countdown/coverage.xml
          flags: countdown
          disable_search: true

      - name: Upload snapshot failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-failures
          path: countdown/tests/images/_failures/
          if-no-files-found: ignore

      - name: Add coverage summary
        if: always()
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  orchestrator-image:
    # The orchestrator's image (countdown/orchestrator/Dockerfile), so a broken one shows up here rather than
    # at release time. Built for amd64 only; the release builds arm64 too.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Build wheels
        run: uv build --wheel --all-packages

      - name: Build image
        run: docker build -f orchestrator/Dockerfile -t countdown-orchestrator:ci .

      - name: Smoke-test the image
        # Without its settings it must start and say which one is missing.
        run: |
          out="$(docker run --rm countdown-orchestrator:ci 2>&1 || true)"
          echo "$out"
          grep -q "BROKER_URL" <<< "$out"

      - name: Smoke-test the image with its settings
        # With the environment server/deploy/docker-compose.yml gives it (stand-ins for the deploy's variables, and a
        # broker that refuses) and the Docker socket, as on the host, but no network: it must load every setting and
        # get as far as asking the broker for the assignments, then keep going. Removed rather than stopped: it doesn't
        # handle SIGTERM, so docker stop would wait 10s and kill it.
        run: |
          mapfile -t env < <(COUNTDOWN_SERVER_VERSION=ci REDIS_PASSWORD=ci ORCHESTRATOR_TOKEN=ci \
            docker compose -f server/deploy/docker-compose.yml config --format json \
            | jq -r '.services.orchestrator.environment + {BROKER_URL: "http://127.0.0.1:9"}
                     | to_entries[] | "--env=\(.key)=\(.value)"')
          test "${#env[@]}" -gt 1
          docker run -d --name smoke --network none -v /var/run/docker.sock:/var/run/docker.sock "${env[@]}" \
            countdown-orchestrator:ci
          for _ in $(seq 30); do
            docker logs smoke 2>&1 | grep -q "Couldn't reach the broker" && break
            sleep 1
          done
          docker logs smoke
          docker logs smoke 2>&1 | grep -q "Couldn't reach the broker"
          test "$(docker inspect -f '{{.State.Running}}' smoke)" = true
          docker rm -f smoke

  server-image:
    # The image renderers run (countdown/server/Dockerfile), so a broken one shows up here rather than
    # at release time. Built for amd64 only; the release builds arm64 too.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Pull latest API Contract submodule
        run: git submodule update --init --remote

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Build wheels
        run: uv build --wheel --all-packages

      # The image only installs what is in dist/ (its packages never come from an index). That includes the
      # countdown_api wheel, which the step above builds from the submodule like the other workspace packages.
      - name: Build image
        # Its own checks run here: the font is baked in and Raqm text layout is available.
        run: docker build -f server/Dockerfile -t countdown-server:ci .

      - name: Smoke-test the image
        # Gets as far as trying to register (with a broker that refuses), then stops cleanly: as the
        # container's PID 1 the app must handle SIGTERM itself, or docker stop has to kill it.
        run: |
          docker run -d --name smoke -e BROKER_URL=http://127.0.0.1:9 -e CLAIM_TOKEN=ci-smoke-test countdown-server:ci
          for _ in $(seq 30); do
            docker logs smoke 2>&1 | grep -q "Couldn't register with the broker" && break
            sleep 1
          done
          docker logs smoke
          docker logs smoke 2>&1 | grep -q "Couldn't register with the broker"
          docker stop smoke
          test "$(docker inspect -f '{{.State.ExitCode}}' smoke)" = 0

  providers-image:
    # The providers' image (countdown/providers/Dockerfile), so a broken one shows up here rather than at release
    # time. Built for amd64 only; the release builds arm64 too.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Pull latest API Contract submodule
        run: git submodule update --init --remote

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Build wheels
        run: uv build --wheel --all-packages

      - name: Build image
        run: docker build -f providers/Dockerfile -t countdown-providers:ci .

      - name: Smoke-test the image
        # Every provider server/deploy/docker-compose.yml runs, with its own command and environment (stand-ins for
        # the deploy's variables), not just the image's default: a console script that's missing, or that fails as it
        # starts, would crash-loop on the host. Side by side and with no network, so no Redis and no API: each must
        # get as far as its loop ("Starting the ... provider") and keep going (not crash-loop), then stop cleanly: as
        # the container's PID 1 it must handle SIGTERM itself, or docker stop has to kill it.
        run: |
          services="$(COUNTDOWN_SERVER_VERSION=ci REDIS_PASSWORD=ci ORCHESTRATOR_TOKEN=ci \
            docker compose -f server/deploy/docker-compose.yml config --format json \
            | jq -c '.services | to_entries[] | select(.value.image | startswith("ghcr.io/nvorkinn/countdown-providers:"))')"
          test -n "$services"
          names=()
          while read -r service; do
            name="smoke-$(jq -r .key <<< "$service")"
            mapfile -t env < <(jq -r '.value.environment // {} | to_entries[] | "--env=\(.key)=\(.value)"' <<< "$service")
            mapfile -t command < <(jq -r '.value.command[]' <<< "$service")
            docker run -d --name "$name" --network none "${env[@]}" countdown-providers:ci "${command[@]}"
            names+=("$name")
          done <<< "$services"
          echo "Started ${#names[@]} providers: ${names[*]}"
          test "${#names[@]}" -gt 1
          for name in "${names[@]}"; do
            for _ in $(seq 30); do
              docker logs "$name" 2>&1 | grep -q "Starting the " && break
              test "$(docker inspect -f '{{.State.Running}}' "$name")" = true || break
              sleep 1
            done
          done
          failed=0
          for name in "${names[@]}"; do
            if ! docker logs "$name" 2>&1 | grep -q "Starting the "; then
              echo "::error::$name didn't start its loop: $(docker logs "$name" 2>&1 | grep -v '^[[:space:]]*$' | tail -1)"
              failed=1
            elif [ "$(docker inspect -f '{{.State.Running}}' "$name")" != true ]; then
              echo "::error::$name stopped by itself"
              failed=1
            fi
          done
          docker stop "${names[@]}"
          for name in "${names[@]}"; do
            echo "::group::$name"
            docker logs "$name" 2>&1
            echo "::endgroup::"
            code="$(docker inspect -f '{{.State.ExitCode}}' "$name")"
            if [ "$code" != 0 ]; then
              echo "::error::$name exited with $code, not 0"
              failed=1
            fi
          done
          exit "$failed"
