name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: countdown

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Pull latest API Contract submodule
        run: git submodule update --init --remote

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Run Ruff
        run: uv run --frozen --only-group dev ruff check --output-format=github .

      - name: Check Ruff formatting
        run: uv run --frozen --only-group dev ruff format --check --diff .

  # The file hygiene hooks of .pre-commit-config.yaml. Ruff and ty are skipped: the lint and ty jobs run them.
  pre-commit:
    runs-on: ubuntu-latest
    env:
      SKIP: ruff-check,ruff-format,ty

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      # The hooks' environments, keyed on the config that pins them.
      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        # From the repository root: the hooks check the whole tree, not just countdown/.
        working-directory: .
        run: uvx pre-commit run --all-files --show-diff-on-failure

  # Type checking, with the ty countdown/uv.lock pins. ty resolves imports from the installed dependencies, so this
  # installs what the test job does (from the same uv cache), but none of its system packages.
  ty:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Pull latest API Contract submodule
        run: git submodule update --init --remote

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run ty
        run: uv run --frozen ty check --output-format=github

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Pull latest API Contract submodule
        run: git submodule update --init --remote

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install system dependencies
        # libfribidi0 turns on Pillow's Raqm text layout, which the golden images are drawn with. redis-server is for the
        # render queue's and the render pool's tests against a real Redis (each starts its own; they skip without it).
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfribidi0 redis-server

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        # One worker per CPU; pytest-cov combines their coverage. Not the snapshot tests: the snapshots job runs those,
        # in the image their goldens are drawn in.
        run: uv run pytest -n auto -m "not snapshot" --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: countdown/coverage.xml
          flags: countdown
          disable_search: true

      - name: Add coverage summary
        if: always()
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  snapshots:
    # The snapshot tests, in the pinned Linux image the goldens are drawn in (dev/snapshots.Dockerfile), so each
    # compares exactly. Locally: dev/snapshots.sh test (or update).
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Pull latest API Contract submodule
        run: git submodule update --init --remote

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        # Its layers are cached by their inputs: the locked packages change only with a pyproject or uv.lock.
        uses: docker/build-push-action@v7
        with:
          context: countdown
          file: countdown/dev/snapshots.Dockerfile
          tags: countdown-snapshots
          load: true
          cache-from: type=gha,scope=snapshots
          cache-to: type=gha,scope=snapshots,mode=max

      - name: Run snapshot tests
        run: |
          SNAPSHOT_SKIP_BUILD=1 ./dev/snapshots.sh test || {
            echo "::error::snapshots differ from their goldens: $(ls tests/images/_failures | grep actual | tr '\n' ' ')"
            exit 1
          }

      - name: Upload snapshot failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-failures
          path: countdown/tests/images/_failures/
          if-no-files-found: ignore

  renderer-image:
    # The render pool's image (countdown/renderer/Dockerfile), so a broken one shows up here rather than at release time.
    # Built for amd64 only; the release builds arm64 too.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Pull latest API Contract submodule
        run: git submodule update --init --remote

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Build wheels and requirements
        run: ./dev/build_dist.sh

      # The image only installs what is in dist/ (its packages never come from an index). That includes the
      # countdown_api wheel, which the step above builds from the submodule like the other workspace packages.
      - name: Build image
        # Its own checks run here: the font is baked in and Raqm text layout is available.
        run: docker build -f renderer/Dockerfile -t countdown-renderer:ci .

      - name: Check the image's default entrypoint
        # A render worker; the compose services name their own entrypoint anyway.
        run: test "$(docker image inspect -f '{{json .Config.Entrypoint}}' countdown-renderer:ci)" = '["countdown-render-worker"]'

      - name: Smoke-test the render pool
        # The render pool's services in renderer/deploy/docker-compose.renderer.yml (the workers and the ticker, all this image),
        # each with its own entrypoint and environment (stand-ins for the deploy's variables), on the
        # host's network with a Redis of their own there, as on the host. Each must start its loop and keep going; the
        # workers must draw a screen put in the pool (its frame record appears) and drop a job for one that isn't; and
        # each must stop cleanly on docker stop.
        run: |
          docker run -d --name redis --network host redis:7-alpine \
            redis-server --bind 127.0.0.1 --port 6379 --requirepass ci --save ''
          rc() { docker exec redis redis-cli -a ci --no-auth-warning "$@"; }
          for _ in $(seq 30); do rc ping 2>/dev/null | grep -q PONG && break; sleep 1; done
          services="$(COUNTDOWN_RENDERER_VERSION=ci REDIS_PASSWORD=ci \
            docker compose -f renderer/deploy/docker-compose.renderer.yml config --format json \
            | jq -c '.services | to_entries[] | select(.value.image | startswith("ghcr.io/nvorkinn/countdown-renderer:"))
                     | select(.value.entrypoint != null)')"
          names=()
          while read -r service; do
            name="smoke-$(jq -r .key <<< "$service")"
            mapfile -t env < <(jq -r '.value.environment // {} | to_entries[] | "--env=\(.key)=\(.value)"' <<< "$service")
            entrypoint="$(jq -r '.value.entrypoint[0]' <<< "$service")"
            docker run -d --name "$name" --network host --entrypoint "$entrypoint" "${env[@]}" countdown-renderer:ci
            names+=("$name")
          done <<< "$services"
          echo "Started ${#names[@]}: ${names[*]}"
          test "${#names[@]}" -ge 2
          for name in "${names[@]}"; do
            for _ in $(seq 30); do docker logs "$name" 2>&1 | grep -q "Starting the render " && break; sleep 1; done
          done
          # A screen in the pool, with nothing set up but the clock, and a job for it and for a screen not in it.
          rc SET v1:config:ci0123456789 "$(jq -c '.value + {tfl: {stop_ids: []}}' api/src/countdown_api/fixtures/config_store.json)"
          rc HSET v1:render:screens ci0123456789 ci-smoke
          rc LPUSH v1:render:jobs ci0123456789 ci9876543210
          for _ in $(seq 30); do test "$(rc HEXISTS v1:frame:ci0123456789 etag)" = 1 && break; sleep 1; done
          failed=0
          if [ "$(rc HEXISTS v1:frame:ci0123456789 etag)" != 1 ]; then
            echo "::error::the render pool didn't draw the pooled screen"; failed=1
          fi
          if [ "$(rc EXISTS v1:frame:ci9876543210)" != 0 ]; then
            echo "::error::the render pool drew a screen that isn't in it"; failed=1
          fi
          for name in "${names[@]}"; do
            if ! docker logs "$name" 2>&1 | grep -q "Starting the render "; then
              echo "::error::$name didn't start its loop: $(docker logs "$name" 2>&1 | tail -1)"; failed=1
            elif [ "$(docker inspect -f '{{.State.Running}}' "$name")" != true ]; then
              echo "::error::$name stopped by itself"; failed=1
            fi
          done
          docker stop "${names[@]}"
          for name in "${names[@]}"; do
            echo "::group::$name"
            docker logs "$name" 2>&1
            echo "::endgroup::"
            code="$(docker inspect -f '{{.State.ExitCode}}' "$name")"
            if [ "$code" != 0 ]; then echo "::error::$name exited with $code, not 0"; failed=1; fi
          done
          docker rm -f redis "${names[@]}"
          exit "$failed"

  providers-image:
    # The providers' image (countdown/providers/Dockerfile), so a broken one shows up here rather than at release
    # time. Built for amd64 only; the release builds arm64 too.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Pull latest API Contract submodule
        run: git submodule update --init --remote

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Build wheels and requirements
        run: ./dev/build_dist.sh

      - name: Build image
        run: docker build -f providers/Dockerfile -t countdown-providers:ci .

      - name: Smoke-test the image
        # Every provider renderer/deploy/docker-compose.providers.yml runs, with its own command and environment (stand-ins for
        # the deploy's variables), not just the image's default: a console script that's missing, or that fails as it
        # starts, would crash-loop on the host. Side by side and with no network, so no Redis and no API: each must
        # get as far as its loop ("Starting the ... provider") and keep going (not crash-loop), then stop cleanly: as
        # the container's PID 1 it must handle SIGTERM itself, or docker stop has to kill it.
        run: |
          services="$(COUNTDOWN_RENDERER_VERSION=ci REDIS_PASSWORD=ci \
            docker compose -f renderer/deploy/docker-compose.providers.yml config --format json \
            | jq -c '.services | to_entries[] | select(.value.image | startswith("ghcr.io/nvorkinn/countdown-providers:"))')"
          test -n "$services"
          names=()
          while read -r service; do
            name="smoke-$(jq -r .key <<< "$service")"
            mapfile -t env < <(jq -r '.value.environment // {} | to_entries[] | "--env=\(.key)=\(.value)"' <<< "$service")
            mapfile -t command < <(jq -r '.value.command[]' <<< "$service")
            docker run -d --name "$name" --network none "${env[@]}" countdown-providers:ci "${command[@]}"
            names+=("$name")
          done <<< "$services"
          echo "Started ${#names[@]} providers: ${names[*]}"
          test "${#names[@]}" -gt 1
          for name in "${names[@]}"; do
            for _ in $(seq 30); do
              docker logs "$name" 2>&1 | grep -q "Starting the " && break
              test "$(docker inspect -f '{{.State.Running}}' "$name")" = true || break
              sleep 1
            done
          done
          failed=0
          for name in "${names[@]}"; do
            if ! docker logs "$name" 2>&1 | grep -q "Starting the "; then
              echo "::error::$name didn't start its loop: $(docker logs "$name" 2>&1 | grep -v '^[[:space:]]*$' | tail -1)"
              failed=1
            elif [ "$(docker inspect -f '{{.State.Running}}' "$name")" != true ]; then
              echo "::error::$name stopped by itself"
              failed=1
            fi
          done
          docker stop "${names[@]}"
          for name in "${names[@]}"; do
            echo "::group::$name"
            docker logs "$name" 2>&1
            echo "::endgroup::"
            code="$(docker inspect -f '{{.State.ExitCode}}' "$name")"
            if [ "$code" != 0 ]; then
              echo "::error::$name exited with $code, not 0"
              failed=1
            fi
          done
          exit "$failed"
