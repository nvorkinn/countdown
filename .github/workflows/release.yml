name: Release

on:
  push:
    tags:
      - "v*"

env:
  SERVER_IMAGE: ghcr.io/nvorkinn/countdown-server

# Jobs that need more (packages, releases) ask for it themselves.
permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME does not point at a commit on main." >&2
            exit 1
          fi

  build-python:
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Stamp version
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Every workspace member: the root project is virtual, so it isn't built.
          for package in countdown-credentials countdown-epd countdown-core countdown-standalone countdown-server countdown-client; do
            (cd countdown && uv version --frozen --package "$package" "$version")
          done
      - name: Install lgpio build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends swig liblgpio-dev
      - name: Build countdown wheels
        working-directory: countdown
        # Every workspace member: the three apps (countdown-standalone, -server, -client) and the
        # libraries they depend on (countdown-core, -credentials, -epd), none of which is on an index.
        run: |
          uv sync --frozen
          uv build --wheel --all-packages
      - uses: actions/upload-artifact@v4
        with:
          name: countdown-wheel
          path: countdown/dist/*.whl

  build-server-image:
    # countdown-server's image, for renderers run with Docker (countdown/server/deploy/), built from
    # this release's own wheels. Only the version tag: :latest moves when the release is promoted
    # (promote-server-image.yml).
    needs: build-python
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: countdown-wheel
          path: countdown/dist
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: countdown
          file: countdown/server/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.SERVER_IMAGE }}:${{ github.ref_name }}

  release:
    # The image too, so a GitHub release is only created once everything it ships exists.
    needs: [build-python, build-server-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: countdown-wheel
          path: countdown/dist
      - name: Bundle encrypted secrets
        run: zip -r secrets.zip secrets
      - name: Create GitHub release and upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            countdown/dist/*.whl \
            countdown/packaging/systemd/countdown.service \
            secrets.zip \
            install.sh \
            --title "$GITHUB_REF_NAME" --generate-notes --prerelease

  deploy-renderers:
    # Brings up the renderers listed in countdown/server/deploy/docker-compose.yml, pinned to this release's image.
    # It runs entirely here: the runner drives the Docker host's daemon over ssh (DOCKER_HOST), so the host needs
    # nothing installed but Docker. It waits for the deploy-renderers environment's approval (Settings >
    # Environments), as the release is still a pre-release at this point.
    needs: release
    runs-on: ubuntu-latest
    environment: deploy-renderers
    concurrency:
      group: deploy-renderers
      cancel-in-progress: false
    env:
      DOCKER_HOST: ssh://${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up SSH
        env:
          ORACLE_SSH_TOKEN: ${{ secrets.ORACLE_SSH_TOKEN }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_SSH_TOKEN" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n' > ~/.ssh/config
      - name: Deploy the renderers
        run: bash countdown/server/deploy/deploy.sh "$GITHUB_REF_NAME"
