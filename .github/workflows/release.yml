name: Release

on:
  push:
    tags:
      - "v*"

# Jobs that need more (packages, releases) ask for it themselves.
permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME does not point at a commit on main." >&2
            exit 1
          fi

  build-python:
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Pull latest API Contract submodule
        run: git submodule update --init --remote

      - uses: astral-sh/setup-uv@v5
      - name: Stamp version
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Every workspace member: the root project is virtual, so it isn't built.
          for package in countdown-api countdown-core countdown-server countdown-providers; do
            (cd countdown && uv version --frozen --package "$package" "$version")
          done
      - name: Build countdown wheels
        working-directory: countdown
        # Every workspace member: the render pool (countdown-server), the providers and the libraries they depend on
        # (countdown-core, countdown-api), none of which is on an index. And each image's third-party requirements,
        # pinned and hashed from uv.lock.
        run: |
          uv sync --frozen
          ./dev/build_dist.sh
      # The images only install what is in dist/ (our packages never come from an index). That includes the
      # countdown_api wheel, which the build above makes from the submodule, stamped with the release's version.
      - uses: actions/upload-artifact@v7
        with:
          name: countdown-wheel
          path: |
            countdown/dist/*.whl
            countdown/dist/requirements-*.txt

  build-image:
    # Each image for each platform on a runner of that platform, as emulating arm64 on an amd64 runner took
    # minutes. Pushed by digest only; publish-image tags them once both platforms are in.
    name: build ${{ matrix.image }} (${{ matrix.platform }})
    needs: build-python
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [ server, providers ]
        platform: [ linux/amd64, linux/arm64 ]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v7
      - name: Pull latest API Contract submodule
        run: git submodule update --init --remote
      - uses: actions/download-artifact@v4
        with:
          name: countdown-wheel
          path: countdown/dist
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: countdown
          file: countdown/${{ matrix.image }}/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/nvorkinn/countdown-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          # The previous release's layers, so the base, apt and third-party layers come out the same (same digests)
          # until their inputs change, and the deploy only pulls our own packages' layers. In the registry rather
          # than the Actions cache, which a tag's run can't read from another tag's.
          cache-from: type=registry,ref=ghcr.io/nvorkinn/countdown-${{ matrix.image }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=ghcr.io/nvorkinn/countdown-${{ matrix.image }}:buildcache-${{ matrix.arch }},mode=max,image-manifest=true,oci-mediatypes=true
      - name: Save the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error

  publish-image:
    # countdown-server's image, the render pool's (countdown/server/deploy/), is tagged with the version and :latest,
    # as every release is the latest. countdown-providers', run there too, is only ever pinned to a version, so there's
    # no :latest to move. Both are built from this release's own wheels.
    name: publish ${{ matrix.image }}
    needs: build-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: server
            tags: ${{ github.ref_name }} latest
          - image: providers
            tags: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.image }}-*
          path: digests
          merge-multiple: true
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Tag both platforms' images together
        working-directory: digests
        env:
          IMAGE: ghcr.io/nvorkinn/countdown-${{ matrix.image }}
          TAGS: ${{ matrix.tags }}
        run: |
          args=()
          for tag in $TAGS; do args+=(-t "$IMAGE:$tag"); done
          docker buildx imagetools create "${args[@]}" $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:${TAGS%% *}"

  release:
    # The image too, so a GitHub release is only created once everything it ships exists.
    needs: [ build-python, publish-image ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Pull latest API Contract submodule
        run: git submodule update --init --remote
      - uses: actions/download-artifact@v4
        with:
          name: countdown-wheel
          path: countdown/dist
      - name: Create GitHub release or update its assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" countdown/dist/*.whl --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              countdown/dist/*.whl \
              --title "$GITHUB_REF_NAME" --generate-notes --prerelease
          fi

  deploy-renderers:
    # Brings up the providers and the render pool in countdown/server/deploy/docker-compose.yml, pinned to this release's
    # images.
    # It runs entirely here: the runner drives the Docker host's daemon over ssh (DOCKER_HOST), so the host needs
    # nothing installed but Docker. It waits for the deploy-renderers environment's approval (Settings >
    # Environments), as the release is still a pre-release at this point.
    needs: release
    runs-on: ubuntu-latest
    environment: deploy-renderers
    concurrency:
      group: deploy-renderers-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      DOCKER_HOST: ssh://${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v7
      - name: Pull latest API Contract submodule
        run: git submodule update --init --remote
      - name: Set up SSH
        env:
          ORACLE_SSH_TOKEN: ${{ secrets.ORACLE_SSH_TOKEN }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_SSH_TOKEN" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # One shared SSH connection for the whole deploy. docker compose opens a new `ssh ... docker system
          # dial-stdio` for every container it starts or waits on, and that burst of logins can exceed the host's
          # sshd MaxStartups, which resets the excess (v1.28.0's deploy failed that way, with every container up).
          printf 'Host *\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n  ControlMaster auto\n  ControlPath ~/.ssh/cm-%%C\n  ControlPersist 10m\n  ServerAliveInterval 15\n' > ~/.ssh/config
      - name: Deploy the renderers
        env:
          # For the providers and the render pool: Redis's password (the same as auth-broker's secrets/redis.env) and TfL's app key.
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}
        run: bash countdown/server/deploy/deploy.sh "$GITHUB_REF_NAME"
