name: Release

on:
  push:
    tags:
      - "v*"

env:
  SERVER_IMAGE: ghcr.io/nvorkinn/countdown-server
  ORCHESTRATOR_IMAGE: ghcr.io/nvorkinn/countdown-orchestrator
  # Pins countdown-api's dependencies to the versions it was generated against.
  UV_CONSTRAINT: https://nvorkinn.github.io/countdown-api/constraints.txt

# Jobs that need more (packages, releases) ask for it themselves.
permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME does not point at a commit on main." >&2
            exit 1
          fi

  build-python:
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Pull latest API Contract submodule
        run: git submodule update --init --remote

      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Stamp version
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Every workspace member: the root project is virtual, so it isn't built.
          for package in countdown-api countdown-credentials countdown-epd countdown-core countdown-server countdown-client countdown-orchestrator; do
            (cd countdown && uv version --frozen --package "$package" "$version")
          done
      - name: Install lgpio build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends swig liblgpio-dev
      - name: Build countdown wheels
        working-directory: countdown
        # Every workspace member: the two apps (countdown-server, -client) and the
        # libraries they depend on (countdown-core, -credentials, -epd), none of which is on an index.
        run: |
          uv sync --frozen
          uv build --wheel --all-packages
      # countdown-core's wheel requires countdown-api, which isn't on PyPI, and the images only install what is in
      # dist/ (our packages never come from an index). So fetch the wheel the lock pins, checked against the lock's
      # hash, from countdown-api's index. It ends up among the release's wheels, which records which API this
      # release was built with.
      - name: Add the countdown-api wheel the lock pins
        working-directory: countdown
        run: |
          uv export --frozen --package countdown-server --no-dev --no-emit-workspace --no-header \
            | awk '/^countdown-api==/ {p=1} p {print} p && !/\\$/ {exit}' > "$RUNNER_TEMP/countdown-api.txt"
          uvx pip download --no-deps --require-hashes --only-binary :all: -r "$RUNNER_TEMP/countdown-api.txt" \
            --index-url https://nvorkinn.github.io/countdown-api/simple/ --dest dist
      - uses: actions/upload-artifact@v4
        with:
          name: countdown-wheel
          path: countdown/dist/*.whl

  build-server-image:
    # countdown-server's image, for renderers run with Docker (countdown/server/deploy/), built from
    # this release's own wheels. Only the version tag: :latest moves when the release is promoted
    # (promote-server-image.yml).
    needs: build-python
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Pull latest API Contract submodule
        run: git submodule update --init --remote
      - uses: actions/download-artifact@v4
        with:
          name: countdown-wheel
          path: countdown/dist
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: countdown
          file: countdown/server/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.SERVER_IMAGE }}:${{ github.ref_name }}

  build-orchestrator-image:
    # countdown-orchestrator's image (countdown/orchestrator/Dockerfile), run beside the renderers by
    # countdown/server/deploy/. Only ever pinned to a version, so there's no :latest to move.
    needs: build-python
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Pull latest API Contract submodule
        run: git submodule update --init --remote
      - uses: actions/download-artifact@v4
        with:
          name: countdown-wheel
          path: countdown/dist
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: countdown
          file: countdown/orchestrator/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.ORCHESTRATOR_IMAGE }}:${{ github.ref_name }}

  release:
    # The image too, so a GitHub release is only created once everything it ships exists.
    needs: [ build-python, build-server-image, build-orchestrator-image ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Pull latest API Contract submodule
        run: git submodule update --init --remote
      - uses: actions/download-artifact@v4
        with:
          name: countdown-wheel
          path: countdown/dist
      - name: Create GitHub release or update its assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" countdown/dist/*.whl --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              countdown/dist/*.whl \
              --title "$GITHUB_REF_NAME" --generate-notes --prerelease
          fi

  deploy-renderers:
    # Brings up the renderers listed in countdown/server/deploy/docker-compose.yml, pinned to this release's image.
    # It runs entirely here: the runner drives the Docker host's daemon over ssh (DOCKER_HOST), so the host needs
    # nothing installed but Docker. It waits for the deploy-renderers environment's approval (Settings >
    # Environments), as the release is still a pre-release at this point.
    needs: release
    runs-on: ubuntu-latest
    environment: deploy-renderers
    concurrency:
      group: deploy-renderers
      cancel-in-progress: false
    env:
      DOCKER_HOST: ssh://${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v7
      - name: Pull latest API Contract submodule
        run: git submodule update --init --remote
      - name: Set up SSH
        env:
          ORACLE_SSH_TOKEN: ${{ secrets.ORACLE_SSH_TOKEN }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_SSH_TOKEN" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n' > ~/.ssh/config
      - name: Deploy the renderers
        env:
          ORCHESTRATOR_TOKEN: ${{ secrets.ORCHESTRATOR_TOKEN }}
        run: bash countdown/server/deploy/deploy.sh "$GITHUB_REF_NAME"
