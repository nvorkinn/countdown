name: Create Global PR Status

# Opens the "Global PR Status" check on a pull request's head commit; All checks completes it. The logic is shared: see
# nvorkinn/.github/.github/workflows/create-global-pr-status.yml.
on:
  pull_request:
    types: [ opened, synchronize, reopened ]

permissions:
  checks: write

jobs:
  create-global-pr-status:
    uses: nvorkinn/.github/.github/workflows/create-global-pr-status.yml@ed4b4410ecea982d66e252c3568d9c9a7234eba7 # main
