[project]
name = "countdown-providers"
version = "0.0.0-dev"
requires-python = ">=3.14"
dependencies = [
    "countdown-shared",
    "pydantic",
    "redis",
]

[project.scripts]
countdown-provider-bank-holidays = "countdown_providers.bank_holidays.main:main"
countdown-provider-entur = "countdown_providers.entur.main:main"
countdown-provider-entur-situations = "countdown_providers.entur_situations.main:main"
countdown-provider-floods = "countdown_providers.floods.main:main"
countdown-provider-locations = "countdown_providers.locations.main:main"
countdown-provider-met-office = "countdown_providers.met_office.main:main"
countdown-provider-metalerts = "countdown_providers.metalerts.main:main"
countdown-provider-tfl = "countdown_providers.tfl.main:main"
countdown-provider-tfl-notices = "countdown_providers.tfl_notices.main:main"
countdown-provider-weather = "countdown_providers.weather.main:main"

[tool.uv.sources]
countdown-shared = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
