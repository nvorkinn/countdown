repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
        # The bundled fonts are 0.3 to 2 MB each.
        exclude: \.ttf$
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
  # Secrets live in Vaultwarden, never in the tree; this catches API keys and tokens that detect-private-key doesn't.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  # Ruff from uv.lock, so commits are checked by the same version as CI and Dependabot's uv updates bump it.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
  # The whole project at once (not just the files committed), with the ty that uv.lock pins and against the
  # workspace's installed dependencies. A local hook rather than astral-sh/ty-pre-commit: that runs `uv check`, which
  # checks only the workspace root's own package (here, none), so it passes without looking at anything.
  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: uv run --frozen ty check
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        always_run: true
        require_serial: true
