repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
        # The bundled fonts are 0.3 to 2 MB each.
        exclude: \.ttf$
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  # The whole project at once (not just the files committed), with the ty that uv.lock pins and against the
  # workspace's installed dependencies. A local hook rather than astral-sh/ty-pre-commit: that runs `uv check`, which
  # checks only the workspace root's own package (here, none), so it passes without looking at anything.
  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: uv run --frozen ty check
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        always_run: true
        require_serial: true
