# Ships this Pi's journal to VictoriaLogs and its host metrics to VictoriaMetrics. Installed to
# /etc/fluent-bit/ by install.sh. FLUENT_BIT_TOKEN (the device secret) and DEVICE_NAME come from
# /run/countdown/fluent-bit-env (RAM), which countdown writes once the broker has accepted its registration;
# Fluent Bit doesn't run before that (systemd/fluent-bit-env.conf).
service:
  flush: 5

pipeline:
  inputs:
    - name: systemd
      tag: journal
      # Off: the first start, right after registration, also sends what was logged before it.
      read_from_tail: off
      # Remembers where it got to, so a restart neither repeats nor skips lines.
      db: /var/lib/fluent-bit/journal.db
      lowercase: off

    # countdown's health gauges (countdown/core/.../otlp_publisher.py: METRICS_URL).
    - name: opentelemetry
      tag: metrics.countdown
      listen: 127.0.0.1
      port: 4318

    - name: cpu
      tag: metrics.cpu
      interval_sec: 60
    - name: mem
      tag: metrics.mem
      interval_sec: 60
    - name: disk
      tag: metrics.disk
      interval_sec: 60
    - name: thermal
      tag: metrics.thermal
      interval_sec: 60

  filters:
    # Every log line leaves with the same fields as the rest of the fleet (auth-broker's too): service, host,
    # level and _msg. host is added here because ${DEVICE_NAME} is only expanded in the config, not in Lua.
    - name: modify
      match: journal
      add: host ${DEVICE_NAME}

    # Builds the standard record from the raw journald fields and drops the rest of them (_BOOT_ID, _MACHINE_ID,
    # _CAP_EFFECTIVE, ...). Kept for debugging: SYSLOG_IDENTIFIER, _PID and _COMM.
    - name: lua
      match: journal
      call: standardise
      code: |
        local levels = {
          ["0"] = "critical", ["1"] = "critical", ["2"] = "critical", ["3"] = "error",
          ["4"] = "warn", ["5"] = "info", ["6"] = "info", ["7"] = "debug",
        }
        function standardise(tag, timestamp, record)
          local unit = record["_SYSTEMD_UNIT"]
          local service = unit and unit:gsub("%.service$", "")
          -- Kernel lines and login sessions have no service unit (or a .scope one), so name them by their program.
          if not service or service == "" or service:match("%.scope$") then
            service = record["SYSLOG_IDENTIFIER"]
          end
          if not service or service == "" then
            service = "unknown"
          end
          return 2, timestamp, {
            service = service,
            host = record["host"],
            level = levels[tostring(record["PRIORITY"])] or "info",
            _msg = record["MESSAGE"],
            SYSLOG_IDENTIFIER = record["SYSLOG_IDENTIFIER"],
            _PID = record["_PID"],
            _COMM = record["_COMM"],
          }
        end

  outputs:
    - name: http
      match: journal
      host: logs.nikolaivorkinn.com
      port: 443
      tls: on
      uri: /insert/jsonline?_stream_fields=service,host&_msg_field=_msg&_time_field=date
      format: json_lines
      json_date_key: date
      json_date_format: iso8601
      header: Authorization Bearer ${FLUENT_BIT_TOKEN}
      retry_limit: no_limits

    - name: prometheus_remote_write
      match: metrics.*
      host: metrics.nikolaivorkinn.com
      port: 443
      tls: on
      uri: /api/v1/write
      header: Authorization Bearer ${FLUENT_BIT_TOKEN}
      retry_limit: no_limits
      add_label: device_name ${DEVICE_NAME}
