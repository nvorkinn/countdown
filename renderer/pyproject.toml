[project]
name = "countdown-renderer"
version = "0.4.2"
requires-python = ">=3.14"
dependencies = [
    "countdown-core[render]",
    # The render pool's metrics (pool_metrics.py), exported over OTLP/HTTP.
    "opentelemetry-api",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-sdk",
    "redis",
]

[project.scripts]
# The render pool (docs/stateless-renderers.md): the workers and the ticker, from the one image.
countdown-render-worker = "countdown_renderer.render_pool:run_worker"
countdown-render-ticker = "countdown_renderer.render_pool:run_ticker"

[tool.uv.sources]
countdown-core = { workspace = true }

[tool.deptry.package_module_name_map]
opentelemetry-api = "opentelemetry"
opentelemetry-sdk = "opentelemetry"
opentelemetry-exporter-otlp-proto-http = "opentelemetry"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
