[project]
name = "countdown-orchestrator"
version = "0.4.2"
requires-python = ">=3.14"
dependencies = [
    "docker>=7.1.0",
    "redis>=8.1.0",
    "requests>=2.32.5",
]

[project.scripts]
countdown-orchestrator = "countdown_orchestrator.main:run"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
