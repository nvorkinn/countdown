# The providers, on the renderers' host (deploy.sh, run by release.yml); see README.md. Their containers are
# providers-<service>-1. Each logs under its `provider-<service>` tag, which names its stream in VictoriaLogs.
name: providers

services:
  # The providers (see ../../providers/README.md): one per API, all from the one image, each picking its provider by
  # `command`. They fetch what the broker's subscriptions in Redis ask for and write it back there, on the host's Redis
  # (host networking). Every deploy starts and upgrades them; REDIS_PASSWORD (and TFL_APP_KEY) come from the
  # deploy-renderers job's secrets, and a missing password fails the deploy rather than start them unauthenticated.
  tfl:
    image: ghcr.io/nvorkinn/countdown-providers:${COUNTDOWN_RENDERER_VERSION:?set by deploy.sh}
    command: countdown-provider-tfl
    pull_policy: always
    restart: unless-stopped
    # Redis listens on the host's 127.0.0.1:6379 (deployed by countdown-server), as Fluent Bit does for the render pool.
    network_mode: host
    environment:
      # Required: a deploy without it fails, rather than start a provider Redis turns away. TFL_APP_KEY is optional.
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Redis's password, from the deploy}
      TFL_APP_KEY: ${TFL_APP_KEY:-}
    logging:
      driver: json-file
      options:
        tag: provider-tfl
        max-size: 10m
        max-file: "3"

  # TfL's disruptions for the notice boards: the lines and stations at the stops, the roads near the postcodes.
  tfl-notices:
    image: ghcr.io/nvorkinn/countdown-providers:${COUNTDOWN_RENDERER_VERSION:?set by deploy.sh}
    command: countdown-provider-tfl-notices
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Redis's password, from the deploy}
      TFL_APP_KEY: ${TFL_APP_KEY:-}
    logging:
      driver: json-file
      options:
        tag: provider-tfl-notices
        max-size: 10m
        max-file: "3"

  weather:
    image: ghcr.io/nvorkinn/countdown-providers:${COUNTDOWN_RENDERER_VERSION:?set by deploy.sh}
    command: countdown-provider-weather
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Redis's password, from the deploy}
    logging:
      driver: json-file
      options:
        tag: provider-weather
        max-size: 10m
        max-file: "3"

  entur:
    image: ghcr.io/nvorkinn/countdown-providers:${COUNTDOWN_RENDERER_VERSION:?set by deploy.sh}
    command: countdown-provider-entur
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Redis's password, from the deploy}
    logging:
      driver: json-file
      options:
        tag: provider-entur
        max-size: 10m
        max-file: "3"

  # The Met Office's weather warnings for the notice boards' UK postcodes (v1:sub:postcode), by place.
  met-office:
    image: ghcr.io/nvorkinn/countdown-providers:${COUNTDOWN_RENDERER_VERSION:?set by deploy.sh}
    command: countdown-provider-met-office
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Redis's password, from the deploy}
    logging:
      driver: json-file
      options:
        tag: provider-met-office
        max-size: 10m
        max-file: "3"

  # gov.uk's bank holidays for every board in the UK: one file, with no subscription, every 6 hours.
  bank-holidays:
    image: ghcr.io/nvorkinn/countdown-providers:${COUNTDOWN_RENDERER_VERSION:?set by deploy.sh}
    command: countdown-provider-bank-holidays
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Redis's password, from the deploy}
    logging:
      driver: json-file
      options:
        tag: provider-bank-holidays
        max-size: 10m
        max-file: "3"

  # The disruptions at the Entur stops, for the notice board: the same subscriptions as `entur`, every 5 minutes.
  entur-situations:
    image: ghcr.io/nvorkinn/countdown-providers:${COUNTDOWN_RENDERER_VERSION:?set by deploy.sh}
    command: countdown-provider-entur-situations
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Redis's password, from the deploy}
    logging:
      driver: json-file
      options:
        tag: provider-entur-situations
        max-size: 10m
        max-file: "3"

  # The Environment Agency's flood warnings near the notice boards' UK postcodes (v1:sub:postcode, which countdown-server
  # writes). The render pool reads them from the store, so a board shows no floods without this.
  floods:
    image: ghcr.io/nvorkinn/countdown-providers:${COUNTDOWN_RENDERER_VERSION:?set by deploy.sh}
    command: countdown-provider-floods
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Redis's password, from the deploy}
    logging:
      driver: json-file
      options:
        tag: provider-floods
        max-size: 10m
        max-file: "3"

  # MET Norway's weather warnings for the notice boards in Norway, fetched once for the whole country.
  metalerts:
    image: ghcr.io/nvorkinn/countdown-providers:${COUNTDOWN_RENDERER_VERSION:?set by deploy.sh}
    command: countdown-provider-metalerts
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Redis's password, from the deploy}
    logging:
      driver: json-file
      options:
        tag: provider-metalerts
        max-size: 10m
        max-file: "3"

  # Where each of the notice boards' postcodes (v1:sub:postcode) is, from postcodes.io and Kartverket, looked up once
  # for every screen and kept for days. The render pool, and the Met Office, floods and TfL roads providers, place a
  # postcode only from the store, so a board with a postcode shows no local notices without this.
  locations:
    image: ghcr.io/nvorkinn/countdown-providers:${COUNTDOWN_RENDERER_VERSION:?set by deploy.sh}
    command: countdown-provider-locations
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Redis's password, from the deploy}
    logging:
      driver: json-file
      options:
        tag: provider-locations
        max-size: 10m
        max-file: "3"
