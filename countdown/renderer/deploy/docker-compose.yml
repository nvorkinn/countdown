# The providers and the render pool, on the renderers' host (deploy.sh, run by release.yml); see README.md.
name: countdown-renderers

services:
  # The providers (see ../../providers/README.md): one per API, all from the one image, each picking its provider by
  # `command`. They fetch what the broker's subscriptions in Redis ask for and write it back there, on the host's Redis
  # (host networking). Every deploy starts and upgrades them; REDIS_PASSWORD (and TFL_APP_KEY) come from the
  # deploy-renderers job's secrets, and a missing password fails the deploy rather than start them unauthenticated.
  provider-tfl:
    image: ghcr.io/nvorkinn/countdown-providers:${COUNTDOWN_RENDERER_VERSION:?set by deploy.sh}
    container_name: provider-tfl-1
    command: countdown-provider-tfl
    pull_policy: always
    restart: unless-stopped
    # Redis listens on the host's 127.0.0.1:6379 (deployed by countdown-server), as Fluent Bit does for the render pool.
    network_mode: host
    environment:
      # Required: a deploy without it fails, rather than start a provider Redis turns away. TFL_APP_KEY is optional.
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Redis's password, from the deploy}
      TFL_APP_KEY: ${TFL_APP_KEY:-}
    logging:
      driver: json-file
      options:
        tag: provider-tfl
        max-size: 10m
        max-file: "3"

  # TfL's disruptions for the notice boards: the lines and stations at the stops, the roads near the postcodes.
  provider-tfl-notices:
    image: ghcr.io/nvorkinn/countdown-providers:${COUNTDOWN_RENDERER_VERSION:?set by deploy.sh}
    container_name: provider-tfl-notices-1
    command: countdown-provider-tfl-notices
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Redis's password, from the deploy}
      TFL_APP_KEY: ${TFL_APP_KEY:-}
    logging:
      driver: json-file
      options:
        tag: provider-tfl-notices
        max-size: 10m
        max-file: "3"

  provider-weather:
    image: ghcr.io/nvorkinn/countdown-providers:${COUNTDOWN_RENDERER_VERSION:?set by deploy.sh}
    container_name: provider-weather-1
    command: countdown-provider-weather
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Redis's password, from the deploy}
    logging:
      driver: json-file
      options:
        tag: provider-weather
        max-size: 10m
        max-file: "3"

  provider-entur:
    image: ghcr.io/nvorkinn/countdown-providers:${COUNTDOWN_RENDERER_VERSION:?set by deploy.sh}
    container_name: provider-entur-1
    command: countdown-provider-entur
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Redis's password, from the deploy}
    logging:
      driver: json-file
      options:
        tag: provider-entur
        max-size: 10m
        max-file: "3"

  # The Met Office's weather warnings for the notice boards' UK postcodes (v1:sub:postcode), by place.
  provider-met-office:
    image: ghcr.io/nvorkinn/countdown-providers:${COUNTDOWN_RENDERER_VERSION:?set by deploy.sh}
    container_name: provider-met-office-1
    command: countdown-provider-met-office
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Redis's password, from the deploy}
    logging:
      driver: json-file
      options:
        tag: provider-met-office
        max-size: 10m
        max-file: "3"

  # gov.uk's bank holidays for every board in the UK: one file, with no subscription, every 6 hours.
  provider-bank-holidays:
    image: ghcr.io/nvorkinn/countdown-providers:${COUNTDOWN_RENDERER_VERSION:?set by deploy.sh}
    container_name: provider-bank-holidays-1
    command: countdown-provider-bank-holidays
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Redis's password, from the deploy}
    logging:
      driver: json-file
      options:
        tag: provider-bank-holidays
        max-size: 10m
        max-file: "3"

  # The disruptions at the Entur stops, for the notice board: the same subscriptions as provider-entur, every 5 minutes.
  provider-entur-situations:
    image: ghcr.io/nvorkinn/countdown-providers:${COUNTDOWN_RENDERER_VERSION:?set by deploy.sh}
    container_name: provider-entur-situations-1
    command: countdown-provider-entur-situations
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Redis's password, from the deploy}
    logging:
      driver: json-file
      options:
        tag: provider-entur-situations
        max-size: 10m
        max-file: "3"

  # The Environment Agency's flood warnings near the notice boards' UK postcodes (v1:sub:postcode, which countdown-server
  # writes). The render pool reads them from the store, so a board shows no floods without this.
  provider-floods:
    image: ghcr.io/nvorkinn/countdown-providers:${COUNTDOWN_RENDERER_VERSION:?set by deploy.sh}
    container_name: provider-floods-1
    command: countdown-provider-floods
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Redis's password, from the deploy}
    logging:
      driver: json-file
      options:
        tag: provider-floods
        max-size: 10m
        max-file: "3"

  # MET Norway's weather warnings for the notice boards in Norway, fetched once for the whole country.
  provider-metalerts:
    image: ghcr.io/nvorkinn/countdown-providers:${COUNTDOWN_RENDERER_VERSION:?set by deploy.sh}
    container_name: provider-metalerts-1
    command: countdown-provider-metalerts
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Redis's password, from the deploy}
    logging:
      driver: json-file
      options:
        tag: provider-metalerts
        max-size: 10m
        max-file: "3"

  # Where each of the notice boards' postcodes (v1:sub:postcode) is, from postcodes.io and Kartverket, looked up once
  # for every screen and kept for days. The render pool, and the Met Office, floods and TfL roads providers, place a
  # postcode only from the store, so a board with a postcode shows no local notices without this.
  provider-locations:
    image: ghcr.io/nvorkinn/countdown-providers:${COUNTDOWN_RENDERER_VERSION:?set by deploy.sh}
    container_name: provider-locations-1
    command: countdown-provider-locations
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Redis's password, from the deploy}
    logging:
      driver: json-file
      options:
        tag: provider-locations
        max-size: 10m
        max-file: "3"

  # The render pool (countdown/docs/stateless-renderers.md): workers that take
  # render jobs off the queue in the host's Redis and draw the screens in v1:render:screens (which countdown-server writes,
  # for every paired device), and a ticker that queues each of those screens every minute. Both from the
  # countdown-renderer image, each with its own entrypoint. Host networking for Redis and the host's Fluent Bit (metrics).
  render-worker-1: &render-worker
    image: ghcr.io/nvorkinn/countdown-renderer:${COUNTDOWN_RENDERER_VERSION:?set by deploy.sh}
    container_name: render-worker-1
    entrypoint: ["countdown-render-worker"]
    pull_policy: always
    # Also when a render passes its deadline, which ends the worker.
    restart: unless-stopped
    network_mode: host
    mem_limit: 512m
    environment: &render-pool-environment
      REDIS_URL: redis://127.0.0.1:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Redis's password, from the deploy}
      # Names the worker in its logs and as its metrics' host.name; each screen is their `device` attribute.
      WORKER_NAME: render-worker-1
    logging:
      driver: json-file
      options:
        tag: render-worker-1
        max-size: 10m
        max-file: "3"

  render-worker-2:
    <<: *render-worker
    container_name: render-worker-2
    environment:
      <<: *render-pool-environment
      WORKER_NAME: render-worker-2
    logging:
      driver: json-file
      options:
        tag: render-worker-2
        max-size: 10m
        max-file: "3"

  render-ticker:
    image: ghcr.io/nvorkinn/countdown-renderer:${COUNTDOWN_RENDERER_VERSION:?set by deploy.sh}
    container_name: render-ticker-1
    entrypoint: ["countdown-render-ticker"]
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    environment:
      REDIS_URL: redis://127.0.0.1:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Redis's password, from the deploy}
    logging:
      driver: json-file
      options:
        tag: render-ticker
        max-size: 10m
        max-file: "3"
