[project]
name = "countdown-core"
version = "0.4.2"
requires-python = ">=3.14"
dependencies = [
    "babel",
    "countdown-api",
    "numpy",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-sdk",
    "pillow",
    "pydantic",
    "pydantic-tfl-api",
    "qrcode",
    "redis",
    "requests",
    "urllib3==2.8.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
