[project]
name = "countdown-core"
version = "0.4.2"
requires-python = ">=3.14"
dependencies = [
    "babel",
    "countdown-api",
    "pillow",
    "pydantic",
    "qrcode",
    "redis",
    "requests",
    "urllib3==2.8.0",
]

[tool.deptry.package_module_name_map]
pillow = "PIL"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
