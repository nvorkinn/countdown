[project]
name = "countdown"
authors = [{ name = "Nikolai Vorkinn" }]

version = "0.4.2"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
# The workspace's own packages, so `uv sync` installs them all (editable) for the tests.
dependencies = [
    "countdown-api",
    "countdown-credentials",
    "countdown-epd",
    "countdown-core",
    "countdown-server",
    "countdown-client",
    "countdown-orchestrator",
]

[tool.uv]
package = false

[tool.uv.sources]
countdown-credentials = { workspace = true }
countdown-epd = { workspace = true }
countdown-core = { workspace = true }
countdown-server = { workspace = true }
countdown-client = { workspace = true }
countdown-orchestrator = { workspace = true }
countdown-api = { workspace = true }

[dependency-groups]
dev = [
    "pyinstrument>=5.1.3",
    "pyproject-runner>=0.3.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pyyaml>=6.0.2",
    "responses>=0.26.3",
    "ruff>=0.16.8",
]

[tool.uv.workspace]
members = [
    "countdown-api",
    "credentials",
    "epd",
    "core",
    "server",
    "client",
    "orchestrator"
]

[tool.coverage.run]
# Not countdown-epd (epd/src): it's only the vendored Waveshare driver.
source = [
    "credentials/src",
    "core/src",
    "server/src",
    "client/src",
    "orchestrator/src"
]
[tool.coverage.report]
skip_empty = true

[tool.ruff]
target-version = "py314"
line-length = 120
# So isort knows the workspace packages are first-party.
src = [
    "countdown-api/src",
    "credentials/src",
    "epd/src",
    "core/src",
    "server/src",
    "client/src",
    "orchestrator/src"
]
# The vendored Waveshare driver.
extend-exclude = [
    "countdown-api/src",
    "epd/src/countdown_epd/epdconfig.py",
    "epd/src/countdown_epd/epd7in5_V2.py",
]
# Even when a file is named on the command line, as pre-commit does with every changed file.
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "TID251"]

# countdown-core must stay free of the e-paper hardware and the apps: they depend on it, never the other
# way round. The ban only applies inside core/ (see per-file-ignores).
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"countdown_server".msg = "countdown-core can't depend on countdown-server; pass what it needs in from there"
"countdown_epd".msg = "countdown-core can't depend on the e-paper driver; it belongs to countdown-epd"

[tool.ruff.lint.per-file-ignores]
"!core/**" = ["TID251"]

[tool.pyproject-runner.tasks]
