[project]
name = "countdown"
authors = [{ name = "Nikolai Vorkinn" }]

version = "0.4.2"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
# The workspace's own packages, so `uv sync` installs them all (editable) for the tests.
dependencies = [
    "countdown-api",
    "countdown-core",
    "countdown-server",
    "countdown-providers",
]

[tool.uv]
package = false

[tool.uv.sources]
countdown-api = { workspace = true }
countdown-core = { workspace = true }
countdown-server = { workspace = true }
countdown-providers = { workspace = true }

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.40.0",
    "pyinstrument>=5.1.3",
    "pyproject-runner>=0.3.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0.2",
    "responses>=0.26.3",
    "ruff>=0.16.8",
    "ty==0.0.91",
]

[tool.uv.workspace]
members = [
    "api",
    "core",
    "server",
    "providers"
]

[tool.coverage.run]
source = [
    "api/src",
    "core/src",
    "server/src",
    "providers/src"
]
[tool.coverage.report]
skip_empty = true

[tool.ruff]
target-version = "py314"
line-length = 120
# So isort knows the workspace packages are first-party.
src = [
    "api/src",
    "core/src",
    "server/src",
    "providers/src"
]
# Even when a file is named on the command line, as pre-commit does with every changed file.
force-exclude = true

[tool.ruff.lint]
# Every rule, bar the few below that can't be satisfied together with another rule or with `ruff format`.
select = ["ALL"]
ignore = [
    "D203",   # one blank line before a class docstring: contradicts D211 (no blank line), which we keep
    "D213",   # summary on the docstring's second line: contradicts D212 (on the first), which we keep
    "COM812", # trailing commas: ruff format adds and removes them itself, and the two fight
    "ISC001", # implicit string concatenation on one line: can clash with ruff format
    "CPY001", # a copyright notice at the top of every file: a policy this repo doesn't have
]

# Pydantic models need their annotations' imports at run time, not only for type checking.
[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

# countdown-core must stay free of the apps: they depend on it, never the other way round.
# The ban only applies inside core/ (see per-file-ignores).
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"countdown_server".msg = "countdown-core can't depend on countdown-server; pass what it needs in from there"
"countdown_providers".msg = "countdown-core can't depend on countdown-providers; pass what it needs in from there"

[tool.ruff.lint.per-file-ignores]
"!core/**" = ["TID251"]
"tests/**" = [
    "S101",    # pytest is built on assert
    "PLR2004", # a test compares against the literal values it expects
    "D1",      # a test's name says what it checks; fixtures and fakes are local to the tests
    "ANN",     # pytest injects fixtures by name, and their types add nothing to a test
    "ARG",     # fixtures requested only for their side effect, and fakes matching a real signature
    "SLF001",  # tests look at private state to check it
    "INP001",  # tests/ is a pytest rootdir, not a package
    "S105",    # fake tokens and passwords
    "S106",
    "S107",
]
"dev/**" = [
    "T201",   # command-line scripts: printing is their output
    "INP001", # standalone scripts, run by path, not a package
]

[tool.pyproject-runner.tasks]

[tool.ty.src]
# api/ is the countdown-api submodule: type checked by its own repository (its package still resolves, from .venv).
exclude = ["api"]

[[tool.ty.overrides]]
# The tests read Optional results without narrowing them first (a None fails the test anyway), build models from
# loose dicts and literals that pydantic coerces, and monkeypatch methods. Those are what these rules flag there;
# the packages are checked with every rule.
include = ["tests/**"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
not-subscriptable = "ignore"
not-iterable = "ignore"
unsupported-operator = "ignore"
invalid-assignment = "ignore"
