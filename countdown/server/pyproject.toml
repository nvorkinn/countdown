[project]
name = "countdown-server"
version = "0.4.2"
requires-python = ">=3.14"
dependencies = [
    "countdown-core",
]

[project.scripts]
# The render pool (docs/stateless-renderers.md): the workers and the ticker, from the one image.
countdown-render-worker = "countdown_server.render_pool:run_worker"
countdown-render-ticker = "countdown_server.render_pool:run_ticker"

[tool.uv.sources]
countdown-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
