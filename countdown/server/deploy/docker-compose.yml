# The orchestrator starts one renderer for each screen assignment. This file deploys the orchestrator to the
# renderers' host (deploy.sh, run by release.yml); see README.md.
name: countdown-renderers

services:
  # Starts renderers for assignments (see ../../orchestrator/README.md). Its renderer containers are not
  # Compose services; they carry no Compose labels and are upgraded by the orchestrator on each release.
  orchestrator:
    image: ghcr.io/nvorkinn/countdown-orchestrator:${COUNTDOWN_SERVER_VERSION:?set by deploy.sh}
    pull_policy: always
    restart: unless-stopped
    environment:
      BROKER_URL: https://auth.nikolaivorkinn.com
      ORCHESTRATOR_TOKEN: ${ORCHESTRATOR_TOKEN:?the orchestrator's token on the broker}
      RENDERER_IMAGE: ghcr.io/nvorkinn/countdown-server:${COUNTDOWN_SERVER_VERSION:?set by deploy.sh}
      MAX_RENDERERS: ${MAX_RENDERERS:-20}
      # Empty (the default) keeps renderers calling TfL, Entur and Open-Meteo themselves. Set to
      # redis://127.0.0.1:6379/0 (with REDIS_PASSWORD) once the providers run, and renderers read departures and
      # weather from the store.
      RENDERER_REDIS_URL: ${RENDERER_REDIS_URL:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # The tag is the stream's `service` in VictoriaLogs (the renderers' is renderer-<slug>, see runtime.py).
    logging:
      driver: json-file
      options:
        tag: orchestrator
        max-size: 10m
        max-file: "3"

  # The providers (see ../../providers/README.md): one per API, all from the one image, each picking its provider by
  # `command`. They fetch what the broker's subscriptions in Redis ask for and write it back there. Scaffolding for
  # now, so they're in the `providers` profile: a plain `docker compose up` (deploy.sh) doesn't start them. Start them
  # by hand with `docker compose --profile providers up -d`.
  provider-tfl:
    profiles: [ providers ]
    image: ghcr.io/nvorkinn/countdown-providers:${COUNTDOWN_SERVER_VERSION:?set by deploy.sh}
    command: countdown-provider-tfl
    pull_policy: always
    restart: unless-stopped
    # Redis listens on the host's 127.0.0.1:6379 (deployed by auth-broker), as Fluent Bit does for the renderers.
    network_mode: host
    environment:
      # `:-` rather than `:?`: not set by the deploy yet, and the profile keeps these services from starting.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      TFL_APP_KEY: ${TFL_APP_KEY:-}
    logging:
      driver: json-file
      options:
        tag: provider-tfl
        max-size: 10m
        max-file: "3"

  provider-weather:
    profiles: [ providers ]
    image: ghcr.io/nvorkinn/countdown-providers:${COUNTDOWN_SERVER_VERSION:?set by deploy.sh}
    command: countdown-provider-weather
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    logging:
      driver: json-file
      options:
        tag: provider-weather
        max-size: 10m
        max-file: "3"

  provider-entur:
    profiles: [ providers ]
    image: ghcr.io/nvorkinn/countdown-providers:${COUNTDOWN_SERVER_VERSION:?set by deploy.sh}
    command: countdown-provider-entur
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    logging:
      driver: json-file
      options:
        tag: provider-entur
        max-size: 10m
        max-file: "3"
