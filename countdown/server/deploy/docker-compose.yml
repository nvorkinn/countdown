# The orchestrator starts one renderer for each screen assignment. This file deploys the orchestrator to the
# renderers' host (deploy.sh, run by release.yml); see README.md.
name: countdown-renderers

services:
  # Starts renderers for assignments (see ../../orchestrator/README.md). Its renderer containers are not
  # Compose services; they carry no Compose labels and are upgraded by the orchestrator on each release.
  orchestrator:
    image: ghcr.io/nvorkinn/countdown-orchestrator:${COUNTDOWN_SERVER_VERSION:?set by deploy.sh}
    pull_policy: always
    restart: unless-stopped
    environment:
      BROKER_URL: https://auth.nikolaivorkinn.com
      ORCHESTRATOR_TOKEN: ${ORCHESTRATOR_TOKEN:?the orchestrator's token on the broker}
      RENDERER_IMAGE: ghcr.io/nvorkinn/countdown-server:${COUNTDOWN_SERVER_VERSION:?set by deploy.sh}
      MAX_RENDERERS: ${MAX_RENDERERS:-20}
      # The store the renderers read (as REDIS_URL, with REDIS_PASSWORD) for the departures, weather, energy and music:
      # the host's Redis, which the providers fill. The renderers no longer call those APIs themselves, so without it
      # (RENDERER_REDIS_URL set to empty: `-`, not `:-`, so an empty value is kept) those panels can't be drawn.
      RENDERER_REDIS_URL: ${RENDERER_REDIS_URL-redis://127.0.0.1:6379/0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # The screens (by slug, separated by commas) the render pool draws instead of their own renderers: each one's
      # renderer is stopped, kept with its volumes, and the screen written into v1:render:screens. Empty: none. From
      # the deploy-renderers job's POOL_SLUGS variable (see ../../orchestrator/README.md, "The render pool").
      POOL_SLUGS: ${POOL_SLUGS:-}
    # For the host's Redis on 127.0.0.1:6379 (RENDERER_REDIS_URL), which it writes the pool's screens to.
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # The tag is the stream's `service` in VictoriaLogs (the renderers' is renderer-<slug>, see runtime.py).
    logging:
      driver: json-file
      options:
        tag: orchestrator
        max-size: 10m
        max-file: "3"

  # The providers (see ../../providers/README.md): one per API, all from the one image, each picking its provider by
  # `command`. They fetch what the broker's subscriptions in Redis ask for and write it back there, on the host's Redis
  # (host networking). Every deploy starts and upgrades them; REDIS_PASSWORD (and TFL_APP_KEY) come from the
  # deploy-renderers job's secrets, and a missing password fails the deploy rather than start them unauthenticated.
  provider-tfl:
    image: ghcr.io/nvorkinn/countdown-providers:${COUNTDOWN_SERVER_VERSION:?set by deploy.sh}
    command: countdown-provider-tfl
    pull_policy: always
    restart: unless-stopped
    # Redis listens on the host's 127.0.0.1:6379 (deployed by auth-broker), as Fluent Bit does for the renderers.
    network_mode: host
    environment:
      # Required: a deploy without it fails, rather than start a provider Redis turns away. TFL_APP_KEY is optional.
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Redis's password, from the deploy}
      TFL_APP_KEY: ${TFL_APP_KEY:-}
    logging:
      driver: json-file
      options:
        tag: provider-tfl
        max-size: 10m
        max-file: "3"

  # TfL's disruptions for the notice boards: the lines and stations at the stops, the roads near the postcodes.
  provider-tfl-notices:
    image: ghcr.io/nvorkinn/countdown-providers:${COUNTDOWN_SERVER_VERSION:?set by deploy.sh}
    command: countdown-provider-tfl-notices
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Redis's password, from the deploy}
      TFL_APP_KEY: ${TFL_APP_KEY:-}
    logging:
      driver: json-file
      options:
        tag: provider-tfl-notices
        max-size: 10m
        max-file: "3"

  provider-weather:
    image: ghcr.io/nvorkinn/countdown-providers:${COUNTDOWN_SERVER_VERSION:?set by deploy.sh}
    command: countdown-provider-weather
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Redis's password, from the deploy}
    logging:
      driver: json-file
      options:
        tag: provider-weather
        max-size: 10m
        max-file: "3"

  provider-entur:
    image: ghcr.io/nvorkinn/countdown-providers:${COUNTDOWN_SERVER_VERSION:?set by deploy.sh}
    command: countdown-provider-entur
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Redis's password, from the deploy}
    logging:
      driver: json-file
      options:
        tag: provider-entur
        max-size: 10m
        max-file: "3"

  # The Met Office's weather warnings for the notice boards' UK postcodes (v1:sub:postcode), by place.
  provider-met-office:
    image: ghcr.io/nvorkinn/countdown-providers:${COUNTDOWN_SERVER_VERSION:?set by deploy.sh}
    command: countdown-provider-met-office
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Redis's password, from the deploy}
    logging:
      driver: json-file
      options:
        tag: provider-met-office
        max-size: 10m
        max-file: "3"

  # gov.uk's bank holidays for every board in the UK: one file, with no subscription, every 6 hours.
  provider-bank-holidays:
    image: ghcr.io/nvorkinn/countdown-providers:${COUNTDOWN_SERVER_VERSION:?set by deploy.sh}
    command: countdown-provider-bank-holidays
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Redis's password, from the deploy}
    logging:
      driver: json-file
      options:
        tag: provider-bank-holidays
        max-size: 10m
        max-file: "3"

  # The disruptions at the Entur stops, for the notice board: the same subscriptions as provider-entur, every 5 minutes.
  provider-entur-situations:
    image: ghcr.io/nvorkinn/countdown-providers:${COUNTDOWN_SERVER_VERSION:?set by deploy.sh}
    command: countdown-provider-entur-situations
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Redis's password, from the deploy}
    logging:
      driver: json-file
      options:
        tag: provider-entur-situations
        max-size: 10m
        max-file: "3"

  # The Environment Agency's flood warnings near the notice boards' UK postcodes (v1:sub:postcode, which auth-broker
  # writes). The renderers read them from the store, so a board shows no floods without this.
  provider-floods:
    image: ghcr.io/nvorkinn/countdown-providers:${COUNTDOWN_SERVER_VERSION:?set by deploy.sh}
    command: countdown-provider-floods
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Redis's password, from the deploy}
    logging:
      driver: json-file
      options:
        tag: provider-floods
        max-size: 10m
        max-file: "3"

  # MET Norway's weather warnings for the notice boards in Norway, fetched once for the whole country.
  provider-metalerts:
    image: ghcr.io/nvorkinn/countdown-providers:${COUNTDOWN_SERVER_VERSION:?set by deploy.sh}
    command: countdown-provider-metalerts
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Redis's password, from the deploy}
    logging:
      driver: json-file
      options:
        tag: provider-metalerts
        max-size: 10m
        max-file: "3"

  # Where each of the notice boards' postcodes (v1:sub:postcode) is, from postcodes.io and Kartverket, looked up once
  # for every screen and kept for days. The renderers, and the Met Office, floods and TfL roads providers, place a
  # postcode only from the store, so a board with a postcode shows no local notices without this.
  provider-locations:
    image: ghcr.io/nvorkinn/countdown-providers:${COUNTDOWN_SERVER_VERSION:?set by deploy.sh}
    command: countdown-provider-locations
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Redis's password, from the deploy}
    logging:
      driver: json-file
      options:
        tag: provider-locations
        max-size: 10m
        max-file: "3"

  # The render pool (docs/stateless-renderers.md, "The pool, the queue and the render function"): workers that take
  # render jobs off the queue in the host's Redis and draw the screens in v1:render:screens, and a ticker that queues
  # each of those screens every minute. From the renderers' image, with another entrypoint. Idle until the
  # orchestrator's POOL_SLUGS puts a screen in the pool. Host networking for Redis and the host's Fluent Bit (metrics).
  render-worker-1: &render-worker
    image: ghcr.io/nvorkinn/countdown-server:${COUNTDOWN_SERVER_VERSION:?set by deploy.sh}
    entrypoint: ["countdown-render-worker"]
    pull_policy: always
    # Also when a render passes its deadline, which ends the worker.
    restart: unless-stopped
    network_mode: host
    mem_limit: 512m
    # The image declares these for a screen's own renderer's identity and key; the pool keeps nothing, so no volumes.
    tmpfs:
      - /data
      - /keys
    environment: &render-pool-environment
      REDIS_URL: redis://127.0.0.1:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Redis's password, from the deploy}
      # Names the worker in its logs and as its metrics' host.name; each screen is their `device` attribute.
      WORKER_NAME: render-worker-1
    logging:
      driver: json-file
      options:
        tag: render-worker-1
        max-size: 10m
        max-file: "3"

  render-worker-2:
    <<: *render-worker
    environment:
      <<: *render-pool-environment
      WORKER_NAME: render-worker-2
    logging:
      driver: json-file
      options:
        tag: render-worker-2
        max-size: 10m
        max-file: "3"

  render-ticker:
    image: ghcr.io/nvorkinn/countdown-server:${COUNTDOWN_SERVER_VERSION:?set by deploy.sh}
    entrypoint: ["countdown-render-ticker"]
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    tmpfs:
      - /data
      - /keys
    environment:
      REDIS_URL: redis://127.0.0.1:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Redis's password, from the deploy}
    logging:
      driver: json-file
      options:
        tag: render-ticker
        max-size: 10m
        max-file: "3"
