[project]
name = "countdown-shared"
version = "0.4.2"
requires-python = ">=3.14"
dependencies = [
    "babel",
    "countdown-api",
    "pydantic",
    "redis",
    "requests",
    "urllib3==2.8.0",
]

[tool.deptry.per_rule_ignores]
# store/file_store.py imports it inside the functions that need it: a development store (REDIS_URL=file:...) runs from
# the workspace, whose dev group has fakeredis[lua]; the images, where the store is Redis, never import it, and a
# missing fakeredis raises a message saying so.
DEP003 = ["fakeredis"]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
